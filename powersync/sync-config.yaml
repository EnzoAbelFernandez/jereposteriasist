# =============================================================================
# PowerSync – Sync Streams: qué datos baja cada usuario a su dispositivo
# =============================================================================
# DEBE reflejar las políticas RLS de supabase/migrations/*_rls.sql (lectura).
# Si cambiás una, cambiá la otra. Las escrituras las valida Supabase (RLS + triggers).
#
# Nota sobre el parser de PowerSync:
#   No admite `IN ('a', 'b')` ni `<>` dentro de subqueries `IN (SELECT ...)`,
#   por lo que se usa `(modulo = 'a' OR modulo = 'b') AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar')`.
# =============================================================================

config:
  edition: 3

streams:
  # ---------- Comunes a todos ----------
  comun:
    auto_subscribe: true
    queries:
      - SELECT * FROM configuracion
      - SELECT * FROM perfiles
      - SELECT * FROM permisos WHERE perfil_id = auth.user_id()
      - SELECT * FROM permisos WHERE auth.user_id() IN (SELECT id FROM perfiles WHERE rol = 'jefe')
      - SELECT * FROM alertas WHERE destinatario_id = auth.user_id()

  tareas:
    auto_subscribe: true
    queries:
      - SELECT * FROM tareas WHERE asignado_a = auth.user_id()
      - SELECT * FROM tareas WHERE creado_por = auth.user_id()
      - SELECT * FROM tareas WHERE auth.user_id() IN (SELECT id FROM perfiles WHERE rol = 'jefe')

  # ---------- Clientes (clientes | pedidos) ----------
  clientes:
    auto_subscribe: true
    queries:
      - SELECT * FROM clientes WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE (modulo = 'clientes' OR modulo = 'pedidos') AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar'))

  # ---------- Catálogo de productos (catalogo | pedidos | produccion) ----------
  productos:
    auto_subscribe: true
    queries:
      - SELECT * FROM productos WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE (modulo = 'catalogo' OR modulo = 'pedidos' OR modulo = 'produccion') AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar'))

  # ---------- Recetas (produccion | catalogo) ----------
  recetas:
    auto_subscribe: true
    queries:
      - SELECT * FROM recetas WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE (modulo = 'produccion' OR modulo = 'catalogo') AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar'))
      - SELECT * FROM receta_items WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE (modulo = 'produccion' OR modulo = 'catalogo') AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar'))

  # ---------- Pedidos (pedidos | produccion) ----------
  pedidos:
    auto_subscribe: true
    queries:
      - SELECT * FROM pedidos WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE (modulo = 'pedidos' OR modulo = 'produccion') AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar'))
      - SELECT * FROM pedido_items WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE (modulo = 'pedidos' OR modulo = 'produccion') AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar'))

  # ---------- Insumos y stock (stock | compras | produccion) ----------
  stock:
    auto_subscribe: true
    queries:
      - SELECT * FROM insumos WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE (modulo = 'stock' OR modulo = 'compras' OR modulo = 'produccion') AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar'))
      - SELECT * FROM movimientos_stock WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE (modulo = 'stock' OR modulo = 'compras' OR modulo = 'produccion') AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar'))

  # ---------- Compras (compras) ----------
  compras:
    auto_subscribe: true
    queries:
      - SELECT * FROM proveedores WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo = 'compras' AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar'))
      - SELECT * FROM compras WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo = 'compras' AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar'))
      - SELECT * FROM compra_items WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo = 'compras' AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar'))

  # ---------- Producción (produccion) ----------
  produccion:
    auto_subscribe: true
    queries:
      - SELECT * FROM producciones WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo = 'produccion' AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar'))

  # ---------- Gastos (gastos | caja) ----------
  gastos:
    auto_subscribe: true
    queries:
      - SELECT * FROM categorias_gasto WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE (modulo = 'gastos' OR modulo = 'caja') AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar'))
      - SELECT * FROM gastos WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE (modulo = 'gastos' OR modulo = 'caja') AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar'))

  # ---------- Caja ----------
  caja:
    auto_subscribe: true
    queries:
      - SELECT * FROM movimientos_caja WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo = 'caja' AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar'))
      - SELECT * FROM movimientos_caja WHERE pedido_id IS NOT NULL AND auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo = 'pedidos' AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar'))
      - SELECT * FROM movimientos_caja WHERE compra_id IS NOT NULL AND auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo = 'compras' AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar'))
      - SELECT * FROM movimientos_caja WHERE gasto_id IS NOT NULL AND auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo = 'gastos' AND (nivel = 'ver' OR nivel = 'cargar' OR nivel = 'editar'))

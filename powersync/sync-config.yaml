# =============================================================================
# PowerSync â€“ Sync Streams: quÃ© datos baja cada usuario a su dispositivo
# =============================================================================
# DEBE reflejar las polÃ­ticas RLS de supabase/migrations/*_rls.sql (lectura).
# Si cambiÃ¡s una, cambiÃ¡ la otra. Las escrituras las valida Supabase (RLS + triggers).
#
# PatrÃ³n de permiso:
#   auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo IN (...) AND nivel IN ('ver','cargar','editar'))
# El jefe tiene 'editar' en todos los mÃ³dulos (lo garantiza un trigger), asÃ­ que no necesita casos especiales,
# salvo en tareas y permisos, que no son mÃ³dulos.
#
# Validar en el panel de PowerSync al desplegar (Sync Streams, edition 3).
# =============================================================================

config:
  edition: 3

streams:
  # ---------- Comunes a todos ----------
  comun:
    auto_subscribe: true
    queries:
      - SELECT * FROM configuracion
      - SELECT * FROM perfiles
      - SELECT * FROM permisos WHERE perfil_id = auth.user_id()
      - SELECT * FROM permisos WHERE auth.user_id() IN (SELECT id FROM perfiles WHERE rol = 'jefe')
      - SELECT * FROM alertas WHERE destinatario_id = auth.user_id()

  tareas:
    auto_subscribe: true
    queries:
      - SELECT * FROM tareas WHERE asignado_a = auth.user_id()
      - SELECT * FROM tareas WHERE creado_por = auth.user_id()
      - SELECT * FROM tareas WHERE auth.user_id() IN (SELECT id FROM perfiles WHERE rol = 'jefe')

  # ---------- Clientes (clientes | pedidos) ----------
  clientes:
    auto_subscribe: true
    queries:
      - SELECT * FROM clientes WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo IN ('clientes', 'pedidos') AND nivel IN ('ver', 'cargar', 'editar'))

  # ---------- CatÃ¡logo de productos (catalogo | pedidos | produccion) ----------
  productos:
    auto_subscribe: true
    queries:
      - SELECT * FROM productos WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo IN ('catalogo', 'pedidos', 'produccion') AND nivel IN ('ver', 'cargar', 'editar'))

  # ---------- Recetas (produccion | catalogo) ----------
  recetas:
    auto_subscribe: true
    queries:
      - SELECT * FROM recetas WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo IN ('produccion', 'catalogo') AND nivel IN ('ver', 'cargar', 'editar'))
      - SELECT * FROM receta_items WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo IN ('produccion', 'catalogo') AND nivel IN ('ver', 'cargar', 'editar'))

  # ---------- Pedidos (pedidos | produccion) ----------
  pedidos:
    auto_subscribe: true
    queries:
      - SELECT * FROM pedidos WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo IN ('pedidos', 'produccion') AND nivel IN ('ver', 'cargar', 'editar'))
      - SELECT * FROM pedido_items WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo IN ('pedidos', 'produccion') AND nivel IN ('ver', 'cargar', 'editar'))

  # ---------- Insumos y stock (stock | compras | produccion) ----------
  stock:
    auto_subscribe: true
    queries:
      - SELECT * FROM insumos WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo IN ('stock', 'compras', 'produccion') AND nivel IN ('ver', 'cargar', 'editar'))
      - SELECT * FROM movimientos_stock WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo IN ('stock', 'compras', 'produccion') AND nivel IN ('ver', 'cargar', 'editar'))

  # ---------- Compras (compras) ----------
  compras:
    auto_subscribe: true
    queries:
      - SELECT * FROM proveedores WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo = 'compras' AND nivel IN ('ver', 'cargar', 'editar'))
      - SELECT * FROM compras WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo = 'compras' AND nivel IN ('ver', 'cargar', 'editar'))
      - SELECT * FROM compra_items WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo = 'compras' AND nivel IN ('ver', 'cargar', 'editar'))

  # ---------- ProducciÃ³n (produccion) ----------
  produccion:
    auto_subscribe: true
    queries:
      - SELECT * FROM producciones WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo = 'produccion' AND nivel IN ('ver', 'cargar', 'editar'))

  # ---------- Gastos (gastos | caja) ----------
  gastos:
    auto_subscribe: true
    queries:
      - SELECT * FROM categorias_gasto WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo IN ('gastos', 'caja') AND nivel IN ('ver', 'cargar', 'editar'))
      - SELECT * FROM gastos WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo IN ('gastos', 'caja') AND nivel IN ('ver', 'cargar', 'editar'))

  # ---------- Caja ----------
  # caja:ver => toda la caja. Sin caja, cada mÃ³dulo ve solo sus movimientos.
  caja:
    auto_subscribe: true
    queries:
      - SELECT * FROM movimientos_caja WHERE auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo = 'caja' AND nivel IN ('ver', 'cargar', 'editar'))
      - SELECT * FROM movimientos_caja WHERE pedido_id IS NOT NULL AND auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo = 'pedidos' AND nivel IN ('ver', 'cargar', 'editar'))
      - SELECT * FROM movimientos_caja WHERE compra_id IS NOT NULL AND auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo = 'compras' AND nivel IN ('ver', 'cargar', 'editar'))
      - SELECT * FROM movimientos_caja WHERE gasto_id IS NOT NULL AND auth.user_id() IN (SELECT perfil_id FROM permisos WHERE modulo = 'gastos' AND nivel IN ('ver', 'cargar', 'editar'))
